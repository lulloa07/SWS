<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Spelling with Sunny</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E81552">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: centered 1200px column; full-width tinted bands with rounded ends; cards only where they mark a separate object. Single light look by design. */
:root{
  --navy:#1A1B19; --navy-2:#2A2B28; --navy-3:#3A3B37;
  --blue:#1A1B19; --sun:#FDC500; --sun-soft:#FFF3C4;
  --sky:#FFF8DC; --mist:#F7F7F4; --line:#EDE6CF; --ink-2:#4A4A45; --ink-3:#5C5C56;
  --on-navy:#E9E9E4; --on-navy-2:#CFCFC8; --white:#FFFFFF;
  --font:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{transition:none!important}}
body{margin:0;background:var(--white);color:var(--navy);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--blue)} a:hover{color:var(--navy)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1248px;margin:0 auto;padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px))}
@media (max-width:600px){.hero,.intake-hero{border-radius:0 0 32px 32px}.services,.voices{border-radius:32px}.site-footer{border-radius:32px 32px 0 0}}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
.h2{font-size:clamp(32px,4.4vw,46px);line-height:1.08;font-weight:800;letter-spacing:-.03em}
.lead{font-size:18px;line-height:1.65;color:var(--ink-2)}
.hl{background:linear-gradient(transparent 58%, var(--sun) 58%)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:14px 28px;border-radius:999px;font-weight:800;font-size:17px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn-sun{background:var(--sun);color:var(--navy)} .btn-sun:hover{color:var(--navy);filter:brightness(.96)}
.btn-navy{background:var(--navy);color:var(--white)} .btn-navy:hover{color:var(--white);background:var(--navy-2)}
.btn-ghost{background:var(--white);color:var(--navy);border:1px solid var(--line);font-weight:700}
.check{display:flex;align-items:center;gap:8px}
.sun-icon{flex:none}
section{scroll-margin-top:16px}

/* header */
.site-header .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-size:21px;font-weight:800;letter-spacing:-.02em}
.brand:hover{color:var(--navy)}
.brand b{color:var(--blue);font-weight:800}
.nav{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center;font-size:15px;font-weight:600}
.nav a{color:var(--navy);text-decoration:none}
.nav a.btn-navy,.nav a.btn-navy:hover{color:var(--white)}
.nav .btn{font-size:15px;min-height:44px;padding:10px 22px}
@media (max-width:760px){.nav .txt{display:none}}

.brand .logo{height:88px;width:auto}
@media (max-width:600px){.brand .logo{height:60px}}
.foot-logo{display:inline-block;background:var(--white);border-radius:20px;padding:10px 16px}
.foot-logo img{height:84px;width:auto}

/* hero */
.hero{background:var(--sky);border-radius:0 0 48px 48px}
.hero .wrap{display:flex;flex-wrap:wrap;gap:56px;align-items:center;padding-block:40px 96px}
.hero-copy{flex:1 1 460px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sun)}
.hero h1{margin:24px 0 22px;font-size:clamp(40px,5.6vw,62px);line-height:1.04;font-weight:800;letter-spacing:-.035em}
.hero .lead{font-size:19px;max-width:520px;margin-bottom:34px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ticks{display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:30px;font-size:15px;font-weight:600;color:var(--ink-2)}
.hero-art{flex:1 1 400px;min-width:0;position:relative;padding:24px 0 24px 24px}
.hero-frame{background:var(--blue);border-radius:36px;padding:18px 18px 0;overflow:hidden}
.hero-frame img{width:100%;height:500px;object-fit:cover;object-position:center 62%;border-radius:24px 24px 0 0}
.float{position:absolute;background:var(--white);box-shadow:0 18px 40px rgba(26,27,25,.16)}
.float-tiles{left:0;bottom:64px;border-radius:20px;padding:16px 18px}
.float-tiles p{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.tiles{display:flex;gap:6px}
.tile{width:40px;height:40px;border-radius:10px;background:var(--sky);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.tile.on{background:var(--sun)} .tile.gap{width:14px;background:none}
.float-badge{right:8px;top:52px;border-radius:999px;padding:10px 16px 10px 10px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.badge-dot{width:34px;height:34px;border-radius:50%;background:var(--sun);display:flex;align-items:center;justify-content:center}
@media (max-width:600px){.hero-frame img{height:380px}.hero-art{padding-left:0}.float-tiles{bottom:24px;left:12px}}

/* about */
.about .wrap{display:flex;flex-wrap:wrap;gap:64px;align-items:center;padding-block:104px}
.about-photo{flex:1 1 340px;min-width:0;background:var(--sun);border-radius:36px;padding:16px}
.about-photo img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:center 12%;border-radius:24px}
.about-copy{flex:1.3 1 460px;min-width:0}
.about-copy .h2{margin-bottom:24px}
.about-copy .lead{font-size:19px;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.chip{background:var(--sky);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:700}
.chip.sun{background:var(--sun-soft)}

@media (max-width:760px){
  .about .wrap{display:block;padding-block:72px}
  .about-photo{margin-left:28px;padding:10px;border-radius:28px}
  .about-photo img{aspect-ratio:4/5;border-radius:20px}
  .about-copy{position:relative;z-index:1;margin-top:-88px;margin-right:20px;background:var(--sky);border-radius:24px;padding:28px 22px 30px;box-shadow:0 18px 40px rgba(26,27,25,.12)}
  .about-copy .h2{margin-bottom:18px}
  .about-copy .lead{font-size:17px}
  .bio .lead{font-size:17px}
  .bio-pull{font-size:18px}
  .chips{gap:10px;margin-top:22px}
  .chip{background:var(--white);font-size:14px;padding:9px 14px}
  .chip.sun{background:var(--sun-soft)}
}

.bio{display:flex;flex-direction:column;gap:16px}
.bio .lead{font-size:18px;line-height:1.7}
.bio-pull{font-size:20px;line-height:1.5;font-weight:700;color:var(--navy);padding-left:18px;border-left:4px solid var(--sun)}
.bio-more{display:flex;flex-direction:column}
.bio-more > p{margin-top:16px}
.bio-more summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:800;color:var(--blue)}
.bio-more summary::-webkit-details-marker{display:none}
.bio-more summary::after{content:"";width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.bio-more[open] summary::after{transform:rotate(-135deg) translate(-2px,0)}
.bio-more .less,.bio-more[open] .more{display:none}
.bio-more[open] .less{display:inline}
.bio-more[open] summary{order:2;margin-top:12px}

/* verse */
.verse{text-align:center;max-width:900px;margin:0 auto;padding-bottom:104px}
.verse .sun-icon{margin:0 auto 18px}
.verse blockquote{margin:0 0 16px;font-size:clamp(22px,3vw,30px);line-height:1.4;font-weight:600;letter-spacing:-.01em}
.verse cite{font-style:normal;font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}

/* method */
.method .wrap{padding-block:104px}
.method-head{display:flex;flex-wrap:wrap;gap:24px 56px;align-items:flex-end;margin-bottom:44px}
.method-head > div{flex:1 1 460px;min-width:0}
.method-head .lead{flex:1 1 360px;min-width:0}
.method-body{display:flex;flex-wrap:wrap;gap:24px;align-items:stretch}
.tabs{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:10px}
.tab{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:14px 20px 14px 14px;border-radius:20px;cursor:pointer;font-family:inherit;text-align:left;background:var(--mist);color:var(--navy);border:1px solid #ECECE6;font-size:18px;font-weight:800;transition:background .2s}
.tab:hover{background:var(--sky)}
.tab .key{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;background:var(--white);box-shadow:0 2px 0 var(--line)}
.tab[aria-selected="true"]{background:var(--sun);border-color:var(--sun)}
.tab[aria-selected="true"] .key{background:var(--navy);color:var(--sun);box-shadow:none}
.panel{flex:2 1 500px;min-width:0;background:var(--navy);color:var(--white);border-radius:32px;padding:clamp(28px,4vw,44px);display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden;min-height:440px}
.panel > *{position:relative}
.panel .ghost{position:absolute;right:-20px;bottom:-60px;font-size:280px;font-weight:800;line-height:1;color:var(--navy-2);letter-spacing:-.05em;pointer-events:none}
.bars{display:flex;gap:6px}
.bars span{flex:1;height:5px;border-radius:999px;background:var(--navy-3);transition:background .3s}
.bars span.on{background:var(--sun)}
.panel .count{font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--sun)}
.panel h3{font-size:clamp(28px,3.4vw,38px);line-height:1.1;font-weight:800;letter-spacing:-.02em;max-width:520px}
.panel .body{font-size:19px;line-height:1.7;color:var(--on-navy);max-width:560px}
.panel-nav{margin-top:auto;padding-top:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.round{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid #55564F;background:transparent;color:var(--white)}
.round.sun{border:0;background:var(--sun);color:var(--navy)}
.panel-nav a{margin-left:auto;color:var(--sun);font-weight:800;text-decoration:none}

/* services */
.services{background:var(--sky);border-radius:48px}
.services .wrap{padding-block:104px}
.services .h2{margin-bottom:44px}
.cards{display:flex;flex-wrap:wrap;gap:22px}
.card{flex:1 1 280px;min-width:0;background:var(--white);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:20px;font-weight:800;margin-top:4px}
.card p{font-size:16px;line-height:1.6;color:var(--ink-2)}
.art{border-radius:18px;height:150px;display:flex;align-items:center;justify-content:center;gap:8px}
.art.sun{background:var(--sun-soft)} .art.sky{background:var(--sky)}
.board{width:58px;height:84px;border-radius:10px;background:var(--white);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:6px;font-size:10px;font-weight:800;text-align:center}
.screen{width:170px;height:104px;border-radius:12px;background:var(--navy);position:relative;display:flex;align-items:center;justify-content:center}
.screen i{position:absolute;right:8px;bottom:8px;width:46px;height:30px;border-radius:6px;background:var(--blue)}
.progress{flex-direction:column;align-items:stretch;gap:10px;padding:0 22px}
.progress .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.progress .track{height:10px;border-radius:999px;background:var(--white);overflow:hidden}
.progress .track i{display:block;width:60%;height:100%;background:var(--sun)}
.progress small{font-size:13px;color:var(--ink-2)}

.svc{padding:16px 16px 28px;gap:12px}
.svc > :not(.svc-photo){margin-left:10px;margin-right:10px}
.svc-photo{aspect-ratio:16/10;max-width:100%;border-radius:20px;background:var(--sun-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:6px}
.svc-photo span{font-size:14px;font-weight:700;color:var(--ink-3)}
.svc-photo img{width:100%;height:100%;object-fit:cover}
.svc h3{font-size:21px}
.svc .btn{margin-top:auto;align-self:flex-start;font-size:15px;min-height:46px;padding:12px 22px}
.svc p:last-of-type{margin-bottom:12px}

/* mid cta */
.band .wrap{padding-block:104px}
.band-inner{background:var(--sun);border-radius:40px;padding:clamp(36px,5vw,64px) clamp(24px,4vw,48px);display:flex;flex-wrap:wrap;gap:32px;align-items:center;justify-content:space-between}
.band-inner h2{flex:1 1 480px;min-width:0;font-size:clamp(30px,4vw,44px);line-height:1.1;font-weight:800;letter-spacing:-.03em}

/* steps */
.steps .wrap{padding-block:104px}
.steps .h2{margin-bottom:44px}
.step-grid{display:flex;flex-wrap:wrap;gap:20px}
.step{flex:1 1 420px;min-width:0;border:1px solid var(--line);border-radius:24px;padding:30px}
.num{display:inline-flex;width:44px;height:44px;border-radius:50%;background:var(--sun);align-items:center;justify-content:center;font-weight:800;font-size:18px}
.step h3{margin:18px 0 8px;font-size:19px;font-weight:800}
.step p{font-size:15px;line-height:1.6;color:var(--ink-2)}

/* testimonials */
.voices{background:var(--navy);color:var(--white);border-radius:48px}
.voices .wrap{padding-block:96px}
.voices .h2{margin-bottom:40px}
.quotes{display:flex;flex-wrap:wrap;gap:20px}
.quote{flex:1 1 320px;min-width:0;background:var(--navy-2);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:22px;margin:0}
.quote.feature{flex:2 1 520px;padding:32px}
.quote blockquote{margin:0;font-size:17px;line-height:1.65}
.quote.feature blockquote{font-size:19px}
.who{margin-top:auto;display:flex;align-items:center;gap:12px;font-weight:700}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--sun);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800}
.placeholder{color:var(--on-navy-2)}

/* faq */
.faq{max-width:860px;margin:0 auto;padding-block:104px}
.faq .h2{text-align:center;margin-bottom:36px}
.faq-list{display:flex;flex-direction:column;gap:14px}
.faq details{background:var(--mist);border-radius:20px;padding:22px 26px}
.faq summary{cursor:pointer;list-style:none;font-size:18px;font-weight:700;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;font-weight:600;color:var(--blue);flex:none}
.faq details[open] summary::after{content:"–"}
.faq details p{margin-top:14px;font-size:16px;line-height:1.65;color:var(--ink-2);max-width:68ch}
.faq details p strong{color:var(--navy)}

/* footer */
.site-footer{background:var(--navy);color:var(--white);border-radius:48px 48px 0 0}
.foot-top{display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between;padding-block:64px 32px}
.foot-top .brand{color:var(--white)} .foot-top .brand b{color:var(--sun)}
.foot-top p{margin-top:12px;font-size:15px;line-height:1.6;color:var(--on-navy-2);max-width:340px}
.foot-links{display:flex;flex-direction:column;gap:10px;font-size:15px;font-weight:600}
.foot-links a{color:var(--white);text-decoration:none}
.foot-links a.sun{color:var(--sun)}
.foot-links .email{text-decoration:underline;user-select:all}
.foot-bottom{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;padding-block:22px 32px;border-top:1px solid var(--navy-3);font-size:14px;color:var(--on-navy-2)}
.foot-bottom a{color:var(--sun);font-weight:700}

/* intake */
.f-header{background:var(--white);border-bottom:1px solid #ECECE6}
.intake-hero{background:var(--sky);border-radius:0 0 48px 48px}
.intake-hero .wrap{display:flex;flex-wrap:wrap;gap:40px;align-items:center;padding-block:64px 72px}
.intake-hero .copy{flex:1 1 500px;min-width:0}
.intake-hero h1{margin:20px 0 18px;font-size:clamp(38px,5vw,54px);line-height:1.06;font-weight:800;letter-spacing:-.035em}
.intake-hero .lead{max-width:600px}
.host{flex:0 1 340px;min-width:0;background:var(--white);border-radius:28px;padding:22px;display:flex;align-items:center;gap:16px;box-shadow:0 18px 40px rgba(26,27,25,.10)}
.host img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:center 25%;border:3px solid var(--sun);flex:none}
.host strong{display:block;font-size:18px;margin-bottom:2px}
.host span{font-size:14px;line-height:1.5;color:var(--ink-2)}
.f-page{background:#FBFBF9}
.f-body{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;padding-block:56px 96px}
.toc{flex:1 1 240px;min-width:0;background:var(--white);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:2px;font-size:15px;font-weight:600}
.toc .label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.toc a{color:var(--navy);text-decoration:none;padding:8px 0}
.toc .note{margin-top:14px;background:var(--sun-soft);border-radius:16px;padding:14px;font-size:14px;line-height:1.5;font-weight:500}
.f-form{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.f-sec{background:var(--white);border-radius:28px;padding:clamp(22px,4vw,36px);display:flex;flex-direction:column;gap:22px}
.f-sec.dark{background:var(--navy);color:var(--white)}
.f-sec .head{display:flex;align-items:center;gap:14px}
.f-sec .head span{width:40px;height:40px;border-radius:50%;background:var(--sun);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.f-sec h2{font-size:clamp(22px,2.6vw,26px);font-weight:800;letter-spacing:-.02em}
.sub{background:#FBFBF9;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:18px}
.sub h3{font-size:18px;font-weight:800}
.sub h3 em{font-style:normal;font-weight:600;color:var(--ink-3)}
.row{display:flex;flex-wrap:wrap;gap:18px}
.row > *{min-width:0}
.f-form label{display:block;font-size:14px;font-weight:700}
.f-sec.dark label{color:var(--white)}
.f-form input[type=text],.f-form input[type=email],.f-form input[type=tel],.f-form input[type=date],.f-form input[type=url],.f-form select,.f-form textarea{display:block;width:100%;margin-top:8px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--white);font-family:inherit;color:var(--navy)}
.f-form textarea{resize:vertical;line-height:1.5}
.f-form input:focus,.f-form select:focus,.f-form textarea:focus{outline:3px solid var(--sun);outline-offset:1px;border-color:var(--blue)}
.f-form fieldset{border:0;margin:0;padding:0;min-width:0}
.f-form legend{padding:0;font-size:14px;font-weight:700;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.f-form label.opt{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;font-weight:600;background:var(--white);color:var(--navy);min-height:44px;cursor:pointer}
.opt input{accent-color:var(--blue);width:18px;height:18px;margin:0}
.help{display:block;margin-top:6px;font-size:14px;font-weight:500;color:var(--ink-3);line-height:1.5}
.consent{font-size:16px;line-height:1.7;color:var(--on-navy)}
.fine{font-size:14px;color:var(--on-navy-2)}
.sent{background:var(--sun-soft);color:var(--navy);border-radius:16px;padding:16px 18px;font-weight:600}

.nf{min-height:100vh;display:flex;align-items:center;background:#FFF8DC}
.nf .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-block:64px}
.nf img{height:110px;width:auto;background:var(--white);border-radius:20px;padding:10px 16px}
.nf h1{font-size:clamp(34px,5vw,52px);line-height:1.08;font-weight:800;letter-spacing:-.03em}
.nf .tiles{justify-content:center}

/* ===== Logo palette theme ===== */
.eyebrow{color:#1A1B19;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:24px;height:4px;border-radius:4px;background:#E81552;flex:none}
.dot{background:#E81552}
.hero,.intake-hero{background:#FFF8DC}
.hero-frame{background:#E81552}
.hl{background:linear-gradient(transparent 60%, #FDC500 60%)}
.about-photo{background:#FDC500}
.chip{background:#FFF3C4} .chip.pinkt{background:#FFE6EE} .chip.greent{background:#EAF4E0} .chip.sun{background:#FDC500}
.bio-pull{border-left-color:#E81552}
.bio-more summary{color:#1A1B19;text-decoration:underline;text-decoration-color:#E81552;text-decoration-thickness:3px;text-underline-offset:6px}
.bio-more summary::after{border-color:#E81552}
.verse cite{color:#1A1B19}
.services{background:#EEF6E6}
.card{box-shadow:0 1px 0 #DCEBCB}
.method-statement{border-left-color:#E81552}
.tab{background:#FBFBF9} .tab:hover{background:#FFF8DC}
.tab[aria-selected="true"] .key{background:#E81552;color:#fff}
.panel{background:#E81552;color:#fff;border:0;box-shadow:0 18px 40px rgba(232,21,82,.25);border-radius:32px}
.panel .ghost{color:#F2457A}
.panel .count{color:#FFF3C4}
.panel .body{color:#fff;font-size:20px;font-weight:600}
.bars span{background:#F57FA3} .bars span.on{background:#FDC500}
.round{border-color:#fff;color:#fff} .round.sun{background:#FDC500;color:#1A1B19}
.panel-nav a{color:#fff;font-size:18px;text-decoration:underline;text-decoration-color:#FDC500;text-decoration-thickness:3px;text-underline-offset:6px}
.btn-navy,.nav a.btn-navy{background:#E81552;color:#fff;font-size:18px}
.btn-navy:hover,.nav a.btn-navy:hover{background:#C9104A;color:#fff}
.nav a.btn-navy{font-size:16px;font-weight:800}
.band-inner{background:#FDC500}
.voices{background:#EEF6E6;color:#1A1B19}
.quote{background:#FFFFFF;color:#1A1B19;box-shadow:0 1px 0 #DCEBCB}
.quote svg{fill:#E81552}
.faq summary::after{color:#E81552}
.faq details{background:#FBFBF9;border:1px solid #ECECE6}
.site-footer{background:#FFF3C4;color:#1A1B19}
.foot-top .brand{color:#1A1B19}
.foot-top p,.foot-bottom{color:#4A4A45}
.foot-links a{color:#1A1B19}
.foot-links a.sun{color:#1A1B19;text-decoration:underline;text-decoration-color:#E81552;text-decoration-thickness:3px;text-underline-offset:5px}
.foot-bottom{border-top-color:#EAD98F}
.foot-bottom a{color:#1A1B19;text-decoration-color:#E81552}
.foot-logo{box-shadow:0 1px 0 #EAD98F}
.badge-dot,.tile.on{background:#FDC500}
.f-sec.dark{background:#FFF3C4;color:#1A1B19}
.f-sec.dark label{color:#1A1B19}
.f-sec.dark .req{color:#D0104A}
.consent{color:#4A4A45} .fine{color:#5C5C56}
.f-sec.dark .btn-sun{background:#E81552;color:#fff;font-size:18px}
.toc .note{background:#FFE6EE}
.svc .btn-sun:hover,.btn-sun:hover{color:#1A1B19}
</style>
</head>
<body>
<main class="nf">
  <div class="wrap">
    <a href="/"><img src="/Images/sunnynewlogo-web.png" alt="Spelling with Sunny home" width="640" height="421"></a>
    <div class="tiles" aria-hidden="true"><span class="tile on">O</span><span class="tile">O</span><span class="tile">P</span><span class="tile">S</span></div>
    <h1>We couldn't find that page.</h1>
    <p class="lead">The link may be out of date. Head back home, or start your speller's intake form.</p>
    <div class="cta-row" style="justify-content:center">
      <a class="btn btn-navy" href="/">Back to home</a>
      <a class="btn btn-sun" href="/intake.html">Start intake</a>
    </div>
  </div>
</main>
</body>
</html>
